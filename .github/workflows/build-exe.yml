name: Montar MangaStudio.exe (Windows)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-desktop.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-desktop.txt pyinstaller==6.22.3

      - name: Ler a versão
        id: ver
        shell: bash
        run: |
          echo "code=$(python -c 'import version; print(version.__version__)')" >> "$GITHUB_OUTPUT"
          echo "name=$(python -c 'import version; print(version.__version_name__)')" >> "$GITHUB_OUTPUT"
          echo "tag=v$(python -c "import version; print(version.__version__.split('-')[0])")-windows" >> "$GITHUB_OUTPUT"

      - name: Montar o .exe com PyInstaller
        run: pyinstaller manga_studio.spec --noconfirm

      - name: Autoteste do .exe (bibliotecas, telas, OCR e seletor de pastas)
        shell: pwsh
        run: |
          $env:MANGA_STUDIO_DATA = "$env:RUNNER_TEMP\ms-data"
          $p = Start-Process -FilePath "dist\MangaStudio\MangaStudio.exe" -ArgumentList "--self-test" -Wait -PassThru
          $log = "$env:MANGA_STUDIO_DATA\logs\manga_studio.log"
          if (Test-Path $log) { Get-Content $log }
          if ($p.ExitCode -ne 0) { throw "Autoteste falhou (código $($p.ExitCode))" }

      - name: Compactar
        shell: pwsh
        run: |
          Copy-Item "LEIA-ME-WINDOWS.txt" "dist\MangaStudio\"
          Compress-Archive -Path "dist\MangaStudio" -DestinationPath "MangaStudio-${{ steps.ver.outputs.tag }}.zip"

      - name: Guardar o .zip na execução
        uses: actions/upload-artifact@v4
        with:
          name: MangaStudio-${{ steps.ver.outputs.tag }}
          path: MangaStudio-${{ steps.ver.outputs.tag }}.zip

      - name: Publicar na página de Releases
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Manga Studio ${{ steps.ver.outputs.name }} para Windows
          target_commitish: ${{ github.sha }}
          files: MangaStudio-${{ steps.ver.outputs.tag }}.zip
          body: |
            Manga Studio ${{ steps.ver.outputs.name }} para Windows (não precisa instalar Python).

            1. Baixe o arquivo MangaStudio-${{ steps.ver.outputs.tag }}.zip abaixo.
            2. Clique com o botão direito no .zip e escolha "Extrair tudo".
            3. Abra a pasta MangaStudio e clique duas vezes em MangaStudio.exe.

            Na primeira vez o Windows pode mostrar "O Windows protegeu o computador" (o programa não é assinado).
            Clique em "Mais informações" e depois em "Executar assim mesmo".

            Seus dados (chaves, memória de traduções, regras e glossário) ficam em %APPDATA%\MangaStudio.
            Se você já usava o Manga Studio pelo código, eles são copiados na primeira execução.
            Para fechar o programa use "Encerrar Manga Studio" no rodapé da lateral.
