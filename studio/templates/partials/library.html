<!-- Aba Biblioteca -->
<section class="tab-view" id="tab-library">
  <div class="library-header">
    <div class="search-bar">
      <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      <input type="search" id="library-search" placeholder="Buscar pelo nome" oninput="filterLibrary()" onkeydown="if (event.key === 'Escape') clearLibrarySearch()" autocomplete="off" aria-label="Buscar mangá pelo nome">
      <button type="button" class="search-clear-btn" id="library-search-clear" onclick="clearLibrarySearch()" title="Limpar busca" aria-label="Limpar busca">✕</button>
    </div>
    <button class="btn-secondary library-refresh-btn" onclick="loadLibrary()" title="Ler as pastas de novo">Atualizar</button>
    <div class="library-search-info" id="library-search-info"></div>
  </div>

  <div class="lib-section-head">
    <h2>Traduzidos</h2>
    <span class="hint">Clique na capa para ler</span>
  </div>
  <div class="manga-grid" id="library-grid"></div>

  <div class="lib-section-head">
    <h2>Originais</h2>
    <span class="hint">Prontos para traduzir</span>
    <button class="btn-secondary push" id="btn-extract-all-archives" onclick="extractAllArchives()" title="Descompacta todos os PDF, ZIP e CBZ da pasta de originais">Descompactar todos os arquivos</button>
  </div>
  <div class="manga-grid" id="raw-library-grid"></div>
</section>
