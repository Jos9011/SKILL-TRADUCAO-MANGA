<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414" />
      <stop offset="50%" stop-color="#1a1a1a" />
      <stop offset="100%" stop-color="#0a0a0a" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1DB954" />
      <stop offset="50%" stop-color="#1ed760" />
      <stop offset="100%" stop-color="#10f090" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1ed760" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#1DB954" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Circular Base Badge -->
  <circle cx="256" cy="256" r="236" fill="url(#bgGrad)" stroke="#1DB954" stroke-width="8" stroke-opacity="0.5" />
  <circle cx="256" cy="256" r="222" fill="none" stroke="#1DB954" stroke-width="1.5" stroke-opacity="0.25" stroke-dasharray="10 8" />

  <!-- Open Manga Book Wings (Stylized 'M' Base) -->
  <path d="M 115 348 C 170 365, 230 350, 256 322 C 282 350, 342 365, 397 348 C 408 344, 416 355, 412 365 C 362 402, 288 398, 256 364 C 224 398, 150 402, 100 365 C 96 355, 104 344, 115 348 Z" fill="url(#brandGrad)" filter="url(#neonGlow)" />

  <!-- Central Manga Dialogue Bubble -->
  <path d="M 256 105 C 168 105, 122 155, 122 225 C 122 262, 142 294, 178 314 L 166 352 L 216 332 C 229 336, 242 338, 256 338 C 344 338, 390 288, 390 225 C 390 155, 344 105, 256 105 Z" fill="#181818" stroke="url(#brandGrad)" stroke-width="12" stroke-linejoin="round" />

  <!-- Spotify-Style Audio/Translation Waves inside Speech Bubble -->
  <!-- Upper Wave -->
  <path d="M 182 192 C 228 168, 284 168, 330 192" fill="none" stroke="url(#brandGrad)" stroke-width="15" stroke-linecap="round" />
  <!-- Center Wave -->
  <path d="M 200 228 C 236 210, 276 210, 312 228" fill="none" stroke="url(#brandGrad)" stroke-width="15" stroke-linecap="round" />
  <!-- Inner Wave -->
  <path d="M 220 264 C 242 250, 270 250, 292 264" fill="none" stroke="url(#brandGrad)" stroke-width="15" stroke-linecap="round" />

  <!-- Magic Sparkle (AI Translation Symbol) -->
  <path d="M 375 125 Q 375 145 395 145 Q 375 145 375 165 Q 375 145 355 145 Q 375 145 375 125 Z" fill="url(#accentGrad)" filter="url(#neonGlow)" />
  <path d="M 135 155 Q 135 168 148 168 Q 135 168 135 181 Q 135 168 122 168 Q 135 168 135 155 Z" fill="url(#brandGrad)" opacity="0.8" />
</svg>
